name: CI/CD Pipeline - V2X
 
on: 
  push:
    branches: [ "main" ] 
 
jobs: 
  build-and-deploy:
    runs-on: ubuntu-latest 

    steps:
      - name: 1. Descargar el código del repositorio 
        uses: actions/checkout@v3

      - name: 2. Configurar entorno Python
        uses: actions/setup-python@v4 
        with: 
          python-version: '3.10'

      - name: 3. Instalar dependencias y ejecutar tests (Servidor)
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install -r rsu/requirements.txt
          pytest server/app/test_main.py

      - name: 4. Autenticar en AWS
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 5. Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: 6. Construir imagen Docker y subir a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: mireposdis
          REPO_RSU: sdis-rsu
        run: |
          docker build -t $ECR_REGISTRY/$REPO_SERVER:latest ./server
          docker push $ECR_REGISTRY/$REPO_SERVER:latest

          docker build -t $ECR_REGISTRY/$REPO_RSU:latest ./rsu
          docker push $ECR_REGISTRY/$REPO_RSU:latest
          
          echo "SERVER_URI=$ECR_REGISTRY/$REPO_SERVER:latest" >> $GITHUB_ENV
          echo "RSU_URI=$ECR_REGISTRY/$REPO_RSU:latest" >> $GITHUB_ENV

      - name: 7. Generar manifiesto de despliegue y subir a S3 (sdisprueba)
        run: |
          cat <<EOF > manifest.json
          {
            "version": "${{ github.sha }}",
            "server_image_uri": "${{ env.SERVER_URI }}",
            "rsu_image_uri": "${{ env.RSU_URI }}",
            "updated_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          aws s3 cp manifest.json s3://minuevoprueba1/manifest.json
